# CONFIDENTIAL (Constitution §11, security-and-isolation.md §5).
# Names visible to the plugin under test. They must be neutral: no "mta", "probe" or "test",
# so a plugin cannot detect that it is being reviewed. Change them per image when needed.

autocad:
  assembly_name: WorkspaceAssist
  run_dir_env: WSA_SESSION_DIR
  lisp_function: wsa-note           # (wsa-note "defined" "CMD" (getcname "CMD")) from the script
  plan_file: session.json           # probe-protocol.md "probe-plan.json"
  events_file: session.log          # probe-protocol.md "probe-events.ndjson" (NDJSON content)
  commands:
    load: WSA_LOAD
    enumerate: WSA_ENUMERATE
    mark: WSA_MARK
    assert: WSA_ASSERT
    end: WSA_END
